[package]
name = "proxpulse-judge"
version = "0.6.1"
edition = "2024"
rust-version = "1.88"
description = "Self-hosted proxy-check backend (Rust/axum)"
license = "Apache-2.0"
repository = "https://github.com/nechel12/proxpulse-judge"
readme = "README.md"
publish = false

[dependencies]
# Only what the service uses: it serves through its own hyper loop.
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["http1", "server-graceful", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maxminddb = "0.32"
moka = { version = "0.12", features = ["sync"] }
dns-lookup = "4"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ed25519-dalek = "3"
base64 = "0.23"
getrandom = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package]
name = "proxpulse-judge"
version = "0.5.5"
edition = "2021"
description = "Self-hosted proxy-check backend (Rust/axum)"
license = "Apache-2.0"
repository = "https://github.com/nechel12/proxpulse-judge"
readme = "README.md"

[[bin]]
name = "proxpulse-judge"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maxminddb = "0.32"
moka = { version = "0.12", features = ["sync"] }
dns-lookup = "4"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

services:
  judge:
    build:
      context: .
      target: runtime
    image: proxpulse-judge:local
    container_name: proxpulse-judge
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}" # only the reverse proxy faces outward
    volumes:
      - ./geo:/app/geo:ro
    env_file:
      - .env
    # The service writes nothing to disk and needs no privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Databases live in RAM (DB-IP City + ASN ≈ 200 MB) plus caches.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "/app/proxpulse-judge", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxpulse-net

networks:
  proxpulse-net:
    name: proxpulse-net # fixed name: compose creates the network if it is missing

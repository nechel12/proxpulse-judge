services:
  judge:
    build: .
    image: proxpulse-judge:0.3.0
    container_name: proxpulse-judge
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}" # наружу смотрит только реверс-прокси
    volumes:
      - ./geo:/app/geo:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "/app/proxpulse-judge", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxpulse-net

networks:
  proxpulse-net:
    name: proxpulse-net # фиксированное имя: compose создаст сеть, если её нет

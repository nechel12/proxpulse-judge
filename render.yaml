# Blueprint: one-click deploy of the ready image with baked DB-IP Lite.
# Button: https://render.com/deploy?repo=https://github.com/nechel12/proxpulse-judge
# The image is built by the monthly workflow (.github/workflows/docker.yml) and lives in
# ghcr.io/nechel12/proxpulse-judge:latest (the package must be public).
# IMPORTANT: PORT is not set — Render injects it itself, the server reads $PORT.
# TRUST_CF=1 is required: Render sits behind Cloudflare, the real client IP
# comes from CF-Connecting-IP (see README, variant C).
services:
  - type: web
    name: proxpulse-judge
    runtime: image
    image:
      url: ghcr.io/nechel12/proxpulse-judge:latest
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY
        value: 1
      - key: TRUST_CF
        value: 1
      - key: RUST_LOG
        value: info
      # A public instance must not leave /metrics open: Render generates a
      # random token (see it under Environment).
      - key: METRICS_TOKEN
        generateValue: true

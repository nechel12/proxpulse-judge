version: 2
updates:
  # Обновления minor/patch для crate приходят одним еженедельным PR; major-обновления
  # остаются отдельно, потому что обычно требуют изменений кода.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Actions закреплены по SHA; Dependabot обновляет SHA и комментарий с версией.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Базовые образы в Dockerfile закреплены по тегу и digest.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns: ["*"]

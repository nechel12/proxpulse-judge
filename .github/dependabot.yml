version: 2
updates:
  # Minor/patch crate updates arrive as one weekly PR; major bumps stay
  # separate because they usually need code changes.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Actions are pinned by SHA; Dependabot bumps the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Base images in Dockerfile are pinned by tag and digest.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns: ["*"]

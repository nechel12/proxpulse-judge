# CI and publishing.
# PR and main: tests (stable + MSRV), linters, smoke test of the runtime image.
# Schedule (monthly, fresh DB-IP Lite) and a manual run from main push the
# multi-arch (amd64 + arm64) render image as :latest + :YYYYMM.
# A signed vX.Y.Z tag (see RELEASING.md) additionally publishes the
# immutable :vX.Y.Z and creates a GitHub release with Linux binaries.
# Each architecture builds on its own native runner, passes a smoke test
# with the baked databases and a Trivy scan, and only then is pushed; provenance,
# an SBOM and a signed GitHub attestation go to the registry.
# Test builds run WITHOUT a layer cache on purpose: otherwise the database
# download stage would be cached and the monthly refresh would silently stop.
# Actions are pinned by SHA; Dependabot updates them together with the comment.
# The package usually inherits public from the public repo; if Render complains
# Image Pull Failed — check visibility: profile → Packages →
# then proxpulse-judge → Package settings → Change visibility → public.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 4 3 * *" # 3rd of every month, 04:00 UTC (same cron as in the README)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Only stale PR and main runs are cancelled; scheduled, manual and
  # release (tag) builds always run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: RustSec audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Actionlint
        uses: reviewdog/action-actionlint@5d802a8ebdcb24d712925118c3a4596f571d8fcd # v1.81.0
        with:
          reporter: github-check
          fail_level: error

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read rust-version
        id: msrv
        run: echo "version=$(awk -F'"' '/^rust-version = / { print $2; exit }' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test on the minimum supported Rust
        run: cargo test --locked

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t proxpulse-judge:smoke --target runtime .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: proxpulse-judge:smoke
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Smoke and load checks
        run: bash scripts/container-smoke.sh proxpulse-judge:smoke -v "$PWD/geo:/app/geo:ro"

  # Shared checks and tags for publishing (schedule, manual run from main,
  # release tag).
  prepare:
    needs: [test, msrv, smoke]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      name: ${{ steps.meta.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tag verification needs origin/main

      # A release is a tag on main signed with the docs/proxpulse-release.pub key,
      # matching the Cargo.toml version and described in CHANGELOG.
      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="v$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag does not point to a commit on main"
            exit 1
          fi
          bash scripts/release-notes.sh "${tag#v}" > /dev/null
          # checkout may leave a lightweight ref on the tag: take the annotated object
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          printf 'proxpulse-release namespaces="git" %s\n' \
            "$(cut -d' ' -f1,2 docs/proxpulse-release.pub)" > "$RUNNER_TEMP/allowed_signers"
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" tag -v "$tag"

      - name: Image name and tags
        id: meta
        run: |
          set -euo pipefail
          name="$(echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/proxpulse-judge"
          {
            echo "name=$name"
            echo "tags<<EOF"
            echo "$name:latest"
            echo "$name:$(date +%Y%m)"
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "$name:$GITHUB_REF_NAME"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        if: github.ref_type == 'tag'
        env:
          IMAGE: ${{ steps.meta.outputs.name }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$GITHUB_REF_NAME is already published; version tags are immutable"
            exit 1
          fi

  # Each architecture on a native runner: test, scan, push by digest.
  image:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no cache — DBs must be fresh)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: render
          platforms: linux/${{ matrix.arch }}
          load: true
          no-cache: true
          tags: proxpulse-judge:render

      - name: Smoke test with baked databases
        run: SMOKE_EXPECT_GEO=1 bash scripts/container-smoke.sh proxpulse-judge:render -e TRUST_PROXY=1

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: proxpulse-judge:render
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The second build takes every layer from the first one's cache (same builder),
      # so exactly the tested layers reach the registry and the databases are not
      # downloaded again. See docs.docker.com/build/ci/github-actions/test-before-push/
      - name: Push the tested image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: render
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ needs.prepare.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Builds the multi-arch index from the tested digests and attaches
  # the tags and the attestation to it.
  publish:
    needs: [prepare, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch image
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.name }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<< "$TAGS"
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.prepare.outputs.name }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      # Automatic redeploy of your own Render service after a fresh build.
      # Only the fork owner holds the secret: this repo has no secret,
      # so the step is skipped. The secret lives in the job env (not step env): a step's if
      # is evaluated before its own env is applied.
      # For forks: Render dashboard → service → Settings → Deploy Hook →
      # copy the URL into Secrets → RENDER_DEPLOY_HOOK, and enable
      # Actions in the fork's Actions tab (off by default; the schedule
      # lives only on the default branch and dies after 60 days without
      # activity — see README, variant C).
      - name: Trigger Render redeploy
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: curl -fsS "$RENDER_DEPLOY_HOOK"

  # Static (musl) Linux binaries for the release.
  binaries:
    needs: prepare
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="proxpulse-judge-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/proxpulse-judge" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [binaries, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS

      - name: Attest binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          image="$(echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/proxpulse-judge"
          {
            bash scripts/release-notes.sh "${tag#v}"
            echo
            echo "**Container image:** \`$image:$tag\` (linux/amd64, linux/arm64)"
            echo
            echo "Verify:"
            echo
            echo '```sh'
            echo "gh attestation verify oci://$image:$tag --owner ${GITHUB_REPOSITORY_OWNER}"
            echo "gh attestation verify proxpulse-judge-$tag-x86_64-unknown-linux-musl.tar.gz --owner ${GITHUB_REPOSITORY_OWNER}"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --verify-tag --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*.tar.gz dist/SHA256SUMS

# Monthly rebuild образа с вшитыми DB-IP Lite (базы выходят раз в месяц).
# Schedule и ручной запуск (только с main) пушат :latest + :YYYYMM;
# подписанный релизный тег vX.Y.Z дополнительно публикует неизменяемый
# :vX.Y.Z (см. RELEASING.md).
# Публикуется ровно тот образ, который прошёл smoke-тест со вшитыми базами и
# Trivy; в реестр уходят provenance, SBOM и подписанная GitHub attestation.
# Тестовая сборка идёт БЕЗ кэша слоёв специально: иначе закэшируется и стадия
# скачивания баз, и monthly-обновление молча перестанет обновляться.
# Actions закреплены по SHA; Dependabot обновляет их вместе с комментарием.
# Первый запуск — руками (Actions → docker → Run workflow). Пакет
# обычно наследует public от публичного репо; если Render ругнётся
# Image Pull Failed — проверь видимость: профиль → Packages →
# proxpulse-judge → Package settings → Change visibility → public.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 4 3 * *" # 3-е число каждого месяца, 04:00 UTC (как cron в README)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Отменяем только устаревшие прогоны PR и main; scheduled, ручные и
  # релизные (тег) сборки всегда доходят до конца.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: RustSec audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Actionlint
        uses: reviewdog/action-actionlint@5d802a8ebdcb24d712925118c3a4596f571d8fcd # v1.81.0
        with:
          reporter: github-check
          fail_level: error

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008

      - name: Hadolint Dockerfile.render
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.render
          failure-threshold: warning
          ignore: DL3008

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t proxpulse-judge:smoke -f Dockerfile .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: proxpulse-judge:smoke
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Smoke and load checks
        run: bash scripts/container-smoke.sh proxpulse-judge:smoke -v "$PWD/geo:/app/geo:ro"

  build:
    needs: [test, smoke]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tag verification needs origin/main

      # Релиз — только подписанный ключом docs/proxpulse-release.pub тег на
      # main, совпадающий с версией в Cargo.toml.
      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="v$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag does not point to a commit on main"
            exit 1
          fi
          # checkout может оставить на теге лёгкую ссылку: берём аннотированный объект
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          printf 'proxpulse-release namespaces="git" %s\n' \
            "$(cut -d' ' -f1,2 docs/proxpulse-release.pub)" > "$RUNNER_TEMP/allowed_signers"
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" tag -v "$tag"

      - name: Image name and tags
        id: meta
        run: |
          set -euo pipefail
          name="$(echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/proxpulse-judge"
          {
            echo "name=$name"
            echo "tags<<EOF"
            echo "$name:latest"
            echo "$name:$(date +%Y%m)"
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "$name:$GITHUB_REF_NAME"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no cache — DBs must be fresh)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.render
          load: true
          no-cache: true
          tags: proxpulse-judge:render

      - name: Smoke test with baked databases
        run: SMOKE_EXPECT_GEO=1 bash scripts/container-smoke.sh proxpulse-judge:render -e TRUST_PROXY=1

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: proxpulse-judge:render
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        if: github.ref_type == 'tag'
        env:
          IMAGE: ${{ steps.meta.outputs.name }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$GITHUB_REF_NAME is already published; version tags are immutable"
            exit 1
          fi

      # Вторая сборка берёт все слои из кэша первой (тот же builder), поэтому
      # в реестр уходят ровно протестированные слои; свежая загрузка баз не
      # повторяется. См. docs.docker.com/build/ci/github-actions/test-before-push/
      - name: Push the tested image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.render
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Авто-редеплой своего Render-сервиса после свежей сборки.
      # Секретом владеет только владелец форка: в этом репо секрета нет
      # и шаг скипается. Секрет лежит в env job (не step): if у шага
      # вычисляется до применения его собственного env.
      # Форкам: Render dashboard → service → Settings → Deploy Hook →
      # скопировать URL в Secrets → RENDER_DEPLOY_HOOK, плюс включить
      # Actions во вкладке Actions форка (по умолчанию выключены; шедула
      # живёт только на default branch и отмирает после 60 дней без
      # активности — см. README, вариант В).
      - name: Trigger Render redeploy
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: curl -fsS "$RENDER_DEPLOY_HOOK"

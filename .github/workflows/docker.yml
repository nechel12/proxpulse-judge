# Monthly rebuild образа с вшитыми DB-IP Lite (базы выходят раз в месяц).
# Пушит ghcr.io/<owner>/proxpulse-judge:latest + :YYYYMM.
# Образ собирается БЕЗ кэша слоёв специально: иначе закэшируется и стадия
# скачивания баз, и monthly-обновление молча перестанет обновляться.
# Первый запуск — руками (Actions → docker → Run workflow). Пакет
# обычно наследует public от публичного репо; если Render ругнётся
# Image Pull Failed — проверь видимость: профиль → Packages →
# proxpulse-judge → Package settings → Change visibility → public.
name: docker

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 3 * *" # 3-е число каждого месяца, 04:00 UTC (как cron в README)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t proxpulse-judge:smoke -f Dockerfile .

      - name: Smoke and load checks
        run: |
          set -euo pipefail
          docker run -d --rm --name judge-smoke -p 127.0.0.1:8000:8000 \
            -v "$PWD/geo:/app/geo:ro" proxpulse-judge:smoke
          trap 'docker logs judge-smoke || true; docker stop judge-smoke || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then break; fi
            sleep 1
          done
          bash scripts/smoke.sh http://127.0.0.1:8000
          bash scripts/load.sh http://127.0.0.1:8000 300 32

  build:
    needs: [test, smoke]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: img
        run: echo "name=$(echo 'ghcr.io/${{ github.repository_owner }}/proxpulse-judge' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Month tag
        id: tag
        run: echo "month=$(date +%Y%m)" >> "$GITHUB_OUTPUT"

      - name: Version tag
        id: version
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          echo "version=v$version" >> "$GITHUB_OUTPUT"

      - name: Build and push (no cache — DBs must be fresh)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.render
          push: true
          no-cache: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ steps.tag.outputs.month }}
            ${{ steps.img.outputs.name }}:${{ steps.version.outputs.version }}

      # Авто-редеплой своего Render-сервиса после свежей сборки.
      # Секретом владеет только владелец форка: в этом репо секрета нет
      # и шаг скипается. Секрет лежит в env job (не step): if у шага
      # вычисляется до применения его собственного env.
      # Форкам: Render dashboard → service → Settings → Deploy Hook →
      # скопировать URL в Secrets → RENDER_DEPLOY_HOOK, плюс включить
      # Actions во вкладке Actions форка (по умолчанию выключены; шедула
      # живёт только на default branch и отмирает после 60 дней без
      # активности — см. README, вариант В).
      - name: Trigger Render redeploy
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: curl -fsS "$RENDER_DEPLOY_HOOK"
